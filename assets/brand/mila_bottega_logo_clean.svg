<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Mila Bottega logo</title>
  <desc id="desc">Minimalist one-color logo with house shaped monogram MB and Mila Bottega wordmark.</desc>
  <defs>
    <style>
      .green { fill: #085041; }
      .cut { fill: #ffffff; }
      .word { font-family: Montserrat, Poppins, Arial, sans-serif; font-weight: 800; letter-spacing: 42px; }
      .sub { font-family: Montserrat, Poppins, Arial, sans-serif; font-weight: 800; letter-spacing: 38px; }
    </style>
  </defs>

  <!-- transparent background -->

  <!-- House / bottega mark -->
  <g id="mark" transform="translate(180 80)">
    <!-- thick closed house outline -->
    <path class="green" fill-rule="evenodd" d="
      M320 0
      L620 260
      L620 650
      L480 650
      L480 350
      L430 350
      L430 650
      L210 650
      L210 350
      L160 350
      L160 650
      L20 650
      L20 260
      Z
      M320 80
      L100 295
      L100 570
      L140 570
      L140 300
      L250 300
      L250 570
      L350 570
      L350 300
      L515 300
      L515 570
      L540 570
      L540 295
      Z"/>

    <!-- M left strokes -->
    <path class="green" d="M135 560 L135 310 L225 310 L320 430 L415 310 L505 310 L505 560 L430 560 L430 420 L330 540 L310 540 L210 420 L210 560 Z"/>

    <!-- B right body, bold geometric -->
    <path class="green" fill-rule="evenodd" d="
      M390 310
      L510 310
      C600 310 650 360 650 430
      C650 475 626 510 585 528
      C632 547 660 587 660 640
      C660 725 598 780 505 780
      L390 780
      Z
      M465 385 L465 495 L505 495 C545 495 570 475 570 440 C570 405 545 385 505 385 Z
      M465 560 L465 705 L515 705 C558 705 585 678 585 632 C585 588 558 560 515 560 Z" transform="translate(-40 -140)"/>

    <!-- doorway negative cutout, no handle dot -->
    <path class="cut" d="M305 650 L305 500 C305 445 345 405 395 405 C445 405 485 445 485 500 L485 650 L425 650 L425 505 C425 482 412 468 395 468 C378 468 365 482 365 505 L365 650 Z" transform="translate(-75 0)"/>
  </g>

  <!-- Wordmark -->
  <text x="500" y="805" text-anchor="middle" class="green word" font-size="118">MILA</text>
  <text x="500" y="900" text-anchor="middle" class="green sub" font-size="58">BOTTEGA</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
